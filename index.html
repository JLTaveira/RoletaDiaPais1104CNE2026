<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Investigação em Versalhes: O Homem da Máscara de Ferro</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Georgia', serif; background-color: #050b14; color: #e0e1dd; overflow: hidden; }
        
        /* Contentor comum para alinhar tudo ao centro */
        .fullscreen-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(5, 11, 20, 0.85); padding: 20px; z-index: 2; }

        /* Fundo da Roleta (Ecrã Inteiro) */
        #fundo-roleta { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 1; transition: background-image 0.1s ease-in-out; display: none; }

        h1 { font-size: 3em; text-shadow: 0 3px 10px rgba(0,0,0,0.8); margin-bottom: 10px; color: #e5ba73; }
        p { font-size: 1.5em; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }

        #btn-jogar { background: #e5ba73; color: #0d1b2a; border: none; padding: 25px 50px; font-size: 1.5em; font-weight: bold; cursor: pointer; box-shadow: 0 5px 25px rgba(0,0,0,0.6); transition: 0.3s; border: 2px solid #fff; }
        #btn-jogar:hover { background: #c5a059; transform: scale(1.05); }

        /* Caixa de Mensagem Final */
        #caixa-resultado { background: rgba(13, 27, 42, 0.9); border: 3px solid #e5ba73; padding: 40px; max-width: 800px; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: none; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #caixa-resultado h2 { font-size: 2.8em; margin: 0 0 20px 0; color: #e5ba73; }
        #caixa-resultado p { font-size: 1.4em; line-height: 1.5; margin: 0; }

        @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="fundo-roleta"></div>

    <div id="ecran-inicial" class="fullscreen-container">
        <h1>Investigação em Versalhes</h1>
        <p>Aproxima-te, Mosqueteiro... Pressiona o botão para receberes a tua ordem de missão.</p>
        <button id="btn-jogar" onclick="iniciarSorteio()">RETIRAR ORDEM DE MISSÃO</button>
    </div>

    <div id="ecran-roleta" class="fullscreen-container" style="display: none; background: rgba(5,11,20,0.5);">
        <h1 style="font-size: 3.5em; letter-spacing: 2px; animation: pulse 1s infinite alternate;">A FILTRAR DESTINOS...</h1>
    </div>

    <div id="ecran-resultado" class="fullscreen-container" style="display: none; background: rgba(5,11,20,0.3);">
        <div id="caixa-resultado">
            <h2 id="titulo-equipa">Parabéns!</h2>
            <p id="msg-equipa"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
